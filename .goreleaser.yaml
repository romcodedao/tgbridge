version: 2
project_name: tgbridge

builds:
  - main: ./cmd/tgbridge
    binary: tgbridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - deploy/tgbridge.service

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing

changelog:
  disable: true
