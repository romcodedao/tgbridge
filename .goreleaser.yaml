version: 2
project_name: tgbridge

builds:
  - main: ./cmd/tgbridge
    binary: tgbridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

release:
  # release-please creates a draft release with the notes; goreleaser uploads the assets to it
  # and leaves it a draft. The workflow publishes it after attesting the assets.
  use_existing_draft: true
  # must equal release-please's release name (v<version>, no component), or goreleaser
  # won't find the draft and creates a second release
  name_template: "{{ .Tag }}"
  draft: true
  mode: keep-existing
  replace_existing_artifacts: true # a re-run after a partial upload would fail with 422

changelog:
  disable: true
